<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HLK OBS 紀錄查詢</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>HLK OBS 紀錄查詢</h1>
    <p>這是手動上傳的資料快照，不會自動同步或修改本機資料庫。</p>
    <p id="snapshot"></p>
    <label for="search">搜尋 OBS ID、描述或重現步驟</label>
    <input id="search" type="search" placeholder="輸入關鍵字" autocomplete="off" disabled>
    <p id="status" role="status">正在讀取資料…</p>
    <section id="results" aria-label="搜尋結果"></section>
  </main>
</body>
</html>
